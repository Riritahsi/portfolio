<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Work — Carl Jude Utrera</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f1d1a'/%3E%3Crect x='25' y='9' width='14' height='46' fill='%23e9e3d7'/%3E%3Crect x='25' y='9' width='14' height='16' fill='%234fb9af'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600&display=swap">
<style>
  :root {
    --ground: #e9e3d7; --ground-2: #e3dccd; --ink: #1f1d1a; --acc: #4fb9af; --acc-deep: #2f7d76; --muted: #6b6659;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ground); color: var(--ink); font-family: 'Poppins', system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: rgba(79, 185, 175, 0.35); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px 100px; }
  .back { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .back:hover { color: var(--acc-deep); }
  h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(48px, 8vw, 100px); line-height: 0.86; margin: 20px 0 8px; letter-spacing: 0.005em; }
  .sub { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 40px; }
  .row { display: grid; grid-template-columns: 56px 80px 1fr auto; gap: 20px; align-items: center; padding: 16px 0; border-top: 1px solid rgba(31,29,26,0.18); transition: opacity 160ms ease, color 160ms ease; }
  .row:hover { color: var(--acc-deep); }
  .row:last-child { border-bottom: 1px solid rgba(31,29,26,0.18); }
  .thumb { width: 56px; height: 56px; flex-shrink: 0; overflow: hidden; background-image: repeating-linear-gradient(135deg, var(--ground-2) 0 8px, #d5cdba 8px 16px); filter: grayscale(0.35) contrast(1.02); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .year { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(24px, 3.2vw, 40px); line-height: 1; letter-spacing: 0.02em; }
  .kicker { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; text-align: right; }
  .empty { padding: 60px 0; color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 46ch; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
  @media (max-width: 560px) {
    .row { grid-template-columns: 44px 50px 1fr; gap: 14px; }
    .kicker { display: none; }
    .thumb { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="./">← Back to portfolio</a>
    <h1>All work</h1>
    <div class="sub" id="count"></div>
    <div id="list"></div>
    <div class="empty" id="empty" style="display: none;">Nothing here yet — the work list hasn't loaded in this browser. Visit the <a href="./" style="color: var(--acc-deep); text-decoration: underline;">portfolio homepage</a> first, then come back.</div>
  </div>
  <script>
    var LS_PREFIX = "cjuPortfolio.";
    var raw = null;
    try { raw = localStorage.getItem(LS_PREFIX + "projects"); } catch (e) {}
    var projects = [];
    try { projects = raw ? JSON.parse(raw) : []; } catch (e) { projects = []; }

    var listEl = document.getElementById("list");
    var countEl = document.getElementById("count");
    var emptyEl = document.getElementById("empty");

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function thumbFor(p) {
      var frames = p.frames || [];
      var chosen = p.thumbnailFrame != null ? frames[p.thumbnailFrame] : null;
      if (chosen && chosen.image) return chosen.image;
      for (var i = 0; i < frames.length; i++) {
        if (frames[i] && frames[i].image) return frames[i].image;
      }
      return null;
    }

    if (!projects.length) {
      emptyEl.style.display = "block";
    } else {
      countEl.textContent = projects.length + (projects.length === 1 ? " project" : " projects") + " — sorted by year";
      var withIdx = projects.map(function (p, i) { return { p: p, i: i }; });
      withIdx.sort(function (a, b) { return String(b.p.year || "").localeCompare(String(a.p.year || "")); });
      withIdx.forEach(function (entry) {
        var a = document.createElement("a");
        a.className = "row";
        a.href = "./?project=" + entry.i;

        var thumbHtml = '<span class="thumb"></span>';
        var img = thumbFor(entry.p);
        if (img) thumbHtml = '<span class="thumb"><img src="' + img.replace(/"/g, "&quot;") + '" alt=""></span>';

        a.innerHTML =
          thumbHtml +
          '<span class="year">' + escapeHtml(entry.p.year) + '</span>' +
          '<span class="title">' + escapeHtml(entry.p.title || "Untitled") + '</span>' +
          '<span class="kicker">' + escapeHtml(entry.p.kicker) + '</span>';
        listEl.appendChild(a);
      });
    }
  </script>
</body>
</html>
